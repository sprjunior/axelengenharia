<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Model Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.js"></script>
    <style>
        :root {
            --panel-bg: rgba(220, 220, 222, 0.72);
            --panel-border: rgba(255, 255, 255, 0.12);
            --text: #eaeaea;
            --text-dim: #9a9a9a;
            --accent: #4fa3ff;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            background: #90D5ff; touch-action: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        canvas { display: block; }

        /* --- top bar --- */
        #topbar {
            position: absolute; top: 0; left: 0; right: 0;
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 16px; pointer-events: none;
            z-index: 10;
        }
        #instructions {
            color: var(--text-dim); font-size: 13px; letter-spacing: 0.01em;
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
        }
        #modeToggle {
            pointer-events: auto;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            padding: 9px 16px;
            border-radius: 8px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex; align-items: center; gap: 8px;
            transition: border-color 0.15s ease, background 0.15s ease;
        }
        #modeToggle:hover { border-color: rgba(255,255,255,0.25); }
        #modeToggle .dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--accent);
        }

        /* --- loading --- */
        #loading {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            flex-direction: column; gap: 10px;
            color: var(--text-dim); font-size: 13px;
            background: #0d0d0f; z-index: 20;
            transition: opacity 0.4s ease;
        }
        #loading .spinner {
            width: 26px; height: 26px; border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.15);
            border-top-color: var(--accent);
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- walk mode lock hint (desktop) --- */
        #lockHint {
            position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.35); z-index: 15; cursor: pointer;
        }
        #lockHint span {
            background: var(--panel-bg); border: 1px solid var(--panel-border);
            color: var(--text); padding: 12px 20px; border-radius: 8px; font-size: 14px;
            backdrop-filter: blur(8px);
        }

        /* --- mobile joystick zone --- */
        #joystickZone {
            position: absolute; left: 0; bottom: 0;
            width: 45vw; height: 45vh; max-width: 260px; max-height: 260px;
            z-index: 12; display: none;
        }

        #exitWalk {
            position: absolute; bottom: 20px; right: 20px;
            pointer-events: auto; z-index: 12; display: none;
            background: var(--panel-bg); border: 1px solid var(--panel-border);
            color: var(--text); font-size: 13px; padding: 9px 16px;
            border-radius: 8px; backdrop-filter: blur(8px);
        }
    </style>
</head>
<body>

    <div id="loading"><div class="spinner"></div>Loading model…</div>

    <div id="topbar">
        <div id="instructions">Orbit — Use o mouse ou os dedos para navegar</div>
        <button id="modeToggle"><span class="dot"></span><span id="modeLabel">MODO CAMINHADA</span></button>
    </div>

    <div id="lockHint"><span>Click para caminhar</span></div>
    <div id="joystickZone"></div>
    <button id="exitWalk">SAIR DO MODO CAMINHADA</button>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // ---------- config ----------
        const MODEL_PATH = 'github.glb';
        const WALK_SPEED = 6.0;
        const WALK_EYE_HEIGHT = 1.7;

        const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

        // ---------- core setup ----------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x14161a);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(5, 4, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 1.1));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);
        const fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
        fillLight.position.set(-10, 5, -10);
        scene.add(fillLight);

        const grid = new THREE.GridHelper(60, 60, 0x2a2d33, 0x1c1e22);
        scene.add(grid);

        // ---------- orbit controls (default mode) ----------
        const orbit = new OrbitControls(camera, renderer.domElement);
        orbit.enableDamping = true;
        orbit.dampingFactor = 0.08;
        orbit.target.set(0, 1, 0);
        orbit.minDistance = 0.5;
        orbit.maxDistance = 200;
        orbit.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
        orbit.update();

        // ---------- walk controls (first-person mode) ----------
        const walk = new PointerLockControls(camera, document.body);
        let walkActive = false;

        const keyState = { forward: false, backward: false, left: false, right: false };
        const velocity = new THREE.Vector3();
        const walkDirection = new THREE.Vector3();

        document.addEventListener('keydown', (e) => {
            if (!walkActive) return;
            if (e.code === 'KeyW' || e.code === 'ArrowUp') keyState.forward = true;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') keyState.backward = true;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') keyState.left = true;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') keyState.right = true;
        });
        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') keyState.forward = false;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') keyState.backward = false;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') keyState.left = false;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') keyState.right = false;
        });
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Escape' && walkActive) setMode('orbit');
        });

        // mobile look (touch-drag) + joystick (move)
        let touchLookX = null, touchLookY = null;
        let joystickX = 0, joystickY = 0;
        let joystick = null;

        function initJoystick() {
            if (joystick) return;
            joystick = nipplejs.create({
                zone: document.getElementById('joystickZone'),
                mode: 'static',
                position: { left: '50%', bottom: '50%' },
                color: '#ffffff'
            });
            joystick.on('move', (evt, data) => {
                if (data && data.vector) {
                    joystickX = data.vector.x;
                    joystickY = data.vector.y;
                }
            });
            joystick.on('end', () => { joystickX = 0; joystickY = 0; });
        }

        renderer.domElement.addEventListener('touchstart', (e) => {
            if (!walkActive) return;
            touchLookX = e.touches[0].clientX;
            touchLookY = e.touches[0].clientY;
        });
        renderer.domElement.addEventListener('touchmove', (e) => {
            if (!walkActive || touchLookX === null) return;
            const dx = e.touches[0].clientX - touchLookX;
            const dy = e.touches[0].clientY - touchLookY;
            camera.rotation.y -= dx * 0.005;
            camera.rotation.x -= dy * 0.005;
            camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));
            camera.rotation.order = 'YXZ';
            touchLookX = e.touches[0].clientX;
            touchLookY = e.touches[0].clientY;
        });
        renderer.domElement.addEventListener('touchend', () => { touchLookX = null; touchLookY = null; });

        // desktop: click to lock pointer while in walk mode
        const lockHint = document.getElementById('lockHint');
        lockHint.addEventListener('click', () => walk.lock());
        walk.addEventListener('lock', () => { lockHint.style.display = 'none'; });
        walk.addEventListener('unlock', () => { if (walkActive && !isTouchDevice) lockHint.style.display = 'flex'; });

        // ---------- mode switching ----------
        const modeToggle = document.getElementById('modeToggle');
        const modeLabel = document.getElementById('modeLabel');
        const instructions = document.getElementById('instructions');
        const joystickZone = document.getElementById('joystickZone');
        const exitWalkBtn = document.getElementById('exitWalk');

        function setMode(mode) {
            walkActive = (mode === 'walk');

            orbit.enabled = !walkActive;

            if (walkActive) {
                // start walking at eye height, looking from current orbit view direction
                camera.position.y = WALK_EYE_HEIGHT;
                camera.rotation.order = 'YXZ';

                modeLabel.textContent = 'SAIR MODO CAMINHADA';
                exitWalkBtn.style.display = 'block';

                if (isTouchDevice) {
                    instructions.textContent = 'ARRASTE PARA OLHAR • joystick para caminhar';
                    joystickZone.style.display = 'block';
                    initJoystick();
                } else {
                    instructions.textContent = 'WASD para caminhar • mouse para olhar • Esc para sair';
                    lockHint.style.display = 'flex';
                }
            } else {
                walk.unlock();
                modeLabel.textContent = 'MODO CAMINHADA';
                instructions.textContent = 'Orbit — drag to rotate, scroll or pinch to zoom';
                joystickZone.style.display = 'none';
                exitWalkBtn.style.display = 'none';
                lockHint.style.display = 'none';
                keyState.forward = keyState.backward = keyState.left = keyState.right = false;
                velocity.set(0, 0, 0);
            }
        }

        modeToggle.addEventListener('click', () => setMode(walkActive ? 'orbit' : 'walk'));
        exitWalkBtn.addEventListener('click', () => setMode('orbit'));

        // ---------- load model ----------
        const loadingEl = document.getElementById('loading');
        const loader = new GLTFLoader();
        loader.load(
            MODEL_PATH,
            (gltf) => {
                scene.add(gltf.scene);

                // frame the model and set a sensible orbit target / walk start point
                const box = new THREE.Box3().setFromObject(gltf.scene);
                if (!box.isEmpty()) {
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);

                    orbit.target.copy(center);
                    camera.position.set(center.x + maxDim, center.y + maxDim * 0.6, center.z + maxDim);
                    orbit.update();
                }

                loadingEl.style.opacity = '0';
                setTimeout(() => loadingEl.style.display = 'none', 400);
            },
            undefined,
            (err) => {
                console.error('Failed to load model:', err);
                loadingEl.innerHTML = `Couldn't load "${MODEL_PATH}"<br><span style="font-size:11px;opacity:0.7">check the file is in the same folder and the name matches</span>`;
            }
        );

        // ---------- resize ----------
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ---------- animation loop ----------
        let prevTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1);
            prevTime = time;

            if (walkActive) {
                if (isTouchDevice) {
                    // joystick-driven movement, horizontal plane only
                    walk.moveForward(joystickY * WALK_SPEED * delta);
                    walk.moveRight(joystickX * WALK_SPEED * delta);
                } else if (walk.isLocked) {
                    velocity.x -= velocity.x * 5.0 * delta;
                    velocity.z -= velocity.z * 5.0 * delta;

                    walkDirection.z = Number(keyState.forward) - Number(keyState.backward);
                    walkDirection.x = Number(keyState.right) - Number(keyState.left);
                    walkDirection.normalize();

                    if (keyState.forward || keyState.backward) velocity.z -= walkDirection.z * 20.0 * delta;
                    if (keyState.left || keyState.right) velocity.x -= walkDirection.x * 20.0 * delta;

                    walk.moveRight(-velocity.x * delta);
                    walk.moveForward(-velocity.z * delta);
                }
                camera.position.y = WALK_EYE_HEIGHT;
            } else {
                orbit.update();
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
