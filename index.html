<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Building Viewer</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        body, html { 
            margin: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            /* Change your background color here (e.g., #f0f0f0 for light gray, white, etc.) */
            background-color: #f0f0f0; 
        }
        model-viewer { 
            width: 100%; 
            height: 100%; 
        }
    </style>
</head>
<body>
    <model-viewer 
        src="github.glb" 
        camera-controls 
        auto-rotate 
        shadow-intensity="1"
        environment-image="neutral">
    </model-viewer>
</body>
</html>
