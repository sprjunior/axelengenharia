<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Building Viewer</title>
    <!-- Import Google Model Viewer Component -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        body, html { 
            margin: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #111; 
        }
        model-viewer { 
            width: 100%; 
            height: 100%; 
        }
    </style>
</head>
<body>
    <!-- References your .glb file directly from the same repository folder -->
    <model-viewer 
        src="github.glb" 
        camera-controls 
        auto-rotate 
        shadow-intensity="1">
    </model-viewer>
</body>
</html>
